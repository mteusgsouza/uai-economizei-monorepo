services:
  - type: web
    name: uai-economizei-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: |
      corepack enable
      corepack prepare pnpm@9 --activate
      cd ../.. && pnpm install --frozen-lockfile
      pnpm --filter @workspace/database build
      pnpm --filter @store/api build
    startCommand: |
      cd ../..
      pnpm --filter @workspace/database db:migrate:deploy
      cd apps/api && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Neon: pooled para a aplicação, unpooled para as migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Origens do front na Vercel (separadas por vírgula).
      - key: CORS_ORIGIN
        sync: false
      # Service account do Firebase (JSON completo). Obrigatória: o guard
      # valida os ID tokens emitidos pelo front via Admin SDK.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # REST do Payload (https://seu-app.vercel.app/api) + chave compartilhada.
      - key: PAYLOAD_API_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Lido implicitamente pelo `put()` do @vercel/blob no UploadService.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
