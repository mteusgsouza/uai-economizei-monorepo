services:
  - type: web
    name: uai-economizei-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm turbo build --filter=@store/api...
    startCommand: |
      pnpm --filter @workspace/database db:migrate:deploy
      node apps/api/dist/main
    healthCheckPath: /health
    # Pula o deploy da API quando o commit mexe só no que é exclusivo do front.
    # Qualquer mudança em apps/api, packages/prisma, lockfile etc. ainda builda.
    buildFilters:
      ignoredPaths:
        - apps/front/**
        - packages/ui/**
    envVars:
      # LTS. Sem pin, o engines ">=20" resolve pro Node mais novo (26, não-LTS).
      - key: NODE_VERSION
        value: 22
      # Neon: pooled para a aplicação, unpooled para as migrations.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # Origens do front na Vercel (separadas por vírgula).
      - key: CORS_ORIGIN
        sync: false
      # Service account do Firebase (JSON completo). Obrigatória: o guard
      # valida os ID tokens emitidos pelo front via Admin SDK.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      # REST do Payload (https://seu-app.vercel.app/api) + chave compartilhada.
      - key: PAYLOAD_API_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Lido implicitamente pelo `put()` do @vercel/blob no UploadService.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
